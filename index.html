<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в BLACKPINK Fan Verse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖤</text></svg>">
    
    <style>
        /* Дополнительные стили только для страницы-приветствия */
        .welcome-title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- Только экран двери -->
    <div class="door-screen active" id="doorScreen">
        <div class="welcome-title">
            ДОБРО ПОЖАЛОВАТЬ В МИР BLACKPINK
        </div>
        
        <div class="door-container" id="doorContainer">
            <!-- Левая створка двери -->
            <div class="door door-left">
                <div class="door-content">
                    <div class="logo-text">
                        <span class="black-text">BLACK</span>
                        <div class="pink-glow"></div>
                    </div>
                    <div class="subtitle">ФАН-СООБЩЕСТВО</div>
                </div>
            </div>
            
            <!-- Правая створка двери -->
            <div class="door door-right">
                <div class="door-content">
                    <div class="logo-text">
                        <span class="pink-text">PINK</span>
                        <div class="pink-glow"></div>
                    </div>
                    <div class="subtitle">ОТ ФАНАТОВ ДЛЯ ФАНАТОВ</div>
                </div>
            </div>
            
            <!-- Центральная ручка и инструкция -->
            <div class="door-center">
                <div class="door-handle" id="doorHandle">
                    <div class="handle-icon">
                        <i class="fas fa-crown"></i>
                    </div>
                    <div class="handle-glow"></div>
                    <div class="handle-text">
                        <span>НАЖМИ, ЧТОБЫ ВОЙТИ</span>
                        <div class="arrow-down">
                            <i class="fas fa-chevron-down"></i>
                        </div>
                    </div>
                </div>
                <div class="door-instruction">
                    <p>Или нажмите <kbd>ПРОБЕЛ</kbd> или <kbd>ENTER</kbd></p>
                </div>
            </div>
        </div>
        
        <!-- Предупреждение об авторских правах -->
        <div class="door-disclaimer">
            <p><i class="fas fa-exclamation-circle"></i> Это неофициальный фан-сайт. Все права принадлежат YG Entertainment.</p>
        </div>
    </div>
    
    <!-- Скрипт только для двери -->
    <script src="door-script.js"></script>
</body>
</html>
